name: Bug report
description: Report something that is broken in RhythmKey
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster it can be fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: When I finish a quotes test, the graph shows an empty chart.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so someone else can hit the same bug.
      placeholder: |
        1. Go to /app/taketypingtest
        2. Set mode to Quotes
        3. Finish the test
        4. Scroll to the chart
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 142, Chrome 140, Safari 18
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - System
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Drag and drop any screenshots or extra logs here.
    validations:
      required: false
